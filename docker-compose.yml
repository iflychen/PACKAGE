name: realdb-project

services:
  postgres:
    image: postgres:18          # 跟你本機 Postgres.app 用的版本(18)對齊
    container_name: realdb_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: realdb
      POSTGRES_DB: REALDB
    ports:
      - "5431:5432"              # 本機:容器，維持你習慣的 5431 對外
    volumes:
      - pgdata:/var/lib/postgresql   # PostgreSQL 18+ 用這個路徑(不是 /var/lib/postgresql/data)
    networks:
      - project_network

volumes:
  pgdata:

networks:
  project_network:
    driver: bridge