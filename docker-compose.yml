name: real-project

services:
  postgres:
    image: postgres:18
    container_name: realdb_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: REALDB
    ports:
      - "5431:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - project_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d REALDB"]
      interval: 5s
      timeout: 3s
      retries: 10

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: always
    ports:
      - "3000:8080"
    volumes:
      - openwebui_data:/app/backend/data
    networks:
      - project_network

  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - project_network

  # Python SPC calculation and AI summary service.
  # No host port is published because pipelines already uses host port 8000.
  # Other containers reach this service through http://spc-api:8000.
  spc-api:
    build: ./spc_model
    image: spc-model:latest
    container_name: spc_api
    restart: always
    expose:
      - "8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:7b
    depends_on:
      ollama:
        condition: service_started
    networks:
      - project_network

  dashboard:
    build: ./dashboard
    image: spc-dashboard:latest
    container_name: spc_dashboard
    restart: always
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/REALDB
      SPC_API_BASE: http://spc-api:8000
      SETTINGS_PASSWORD: ${SETTINGS_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      spc-api:
        condition: service_healthy
    networks:
      - project_network

  pipelines:
    build: ./pipelines
    image: aniki-pipelines:latest
    container_name: aniki_pipelines
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/REALDB
      ANIKI_API_KEY: ${ANIKI_API_KEY}
      OLLAMA_URL: http://ollama:11434/api/chat
      VLM_MODEL: qwen2.5vl:7b
      VLM_RECHECK_MODEL: qwen2.5vl:7b
      OLLAMA_KEEP_ALIVE: 10m
      REVIEW_DB_PATH: /app/data/review_tasks.db
    volumes:
      - pipelines_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - project_network

volumes:
  pgdata:
  openwebui_data:
  ollama_data:
  pipelines_data:

networks:
  project_network:
    driver: bridge
