name: real-project

services:
  postgres:
    image: postgres:18          # 跟你本機 Postgres.app 用的版本(18)對齊
    container_name: realdb_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: REALDB
    ports:
      - "5431:5432"              # 本機:容器，維持你習慣的 5431 對外
    volumes:
      - pgdata:/var/lib/postgresql   # PostgreSQL 18+ 用這個路徑(不是 /var/lib/postgresql/data)
    networks:
      - project_network
  
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: always
    ports:
      - "3000:8080"                  # 跟你目前習慣的 port 對齊
    volumes:
      - openwebui_data:/app/backend/data   # 保存聊天紀錄、設定等資料
    networks:
      - project_network

  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama    # 保存下載好的模型，避免每次重啟都要重新下載
    networks:
      - project_network

volumes:
  pgdata:
  openwebui_data:
  ollama_data:

networks:
  project_network:
    driver: bridge