# =============================================================================
#  正式部署用 compose —— 只 pull，不 build
#  ---------------------------------------------------------------------------
#  三個自製 image 由 GitHub Actions 建好推到 GHCR，這裡直接拉下來用。
#  部署機器不需要 Node.js、Python 工具鏈，也不會因為 npm / pip 套件漂移而失敗。
#
#  用法：
#      cp .env.example .env      # 填 DB_PASSWORD / ANIKI_API_KEY
#      # 再補上這兩行（CI 的 Actions Summary 會直接給你）：
#      #   GHCR_OWNER=<你的 github 帳號，全小寫>
#      #   IMAGE_TAG=1.0.0
#      docker compose -f docker-compose.prod.yml pull
#      docker compose -f docker-compose.prod.yml up -d
#
#  回退到上一版：把 .env 的 IMAGE_TAG 改掉，重跑上面兩行即可。
#
#  注意：這個檔仍然需要 repo 裡的幾個檔案（bind mount）：
#      REALDB_backup.dump / init-realdb.sh / dashboard/db/migrations/
#      pipelines/openwebui_*.py / ipqc/
#  所以部署機器還是要 clone 這個 repo —— 只是不用再 build。
# =============================================================================

name: real-project

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18}
    container_name: realdb_postgres
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?請在 .env 設定 DB_PASSWORD}
      POSTGRES_DB: REALDB
    ports:
      - "5431:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - project_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d REALDB"]
      interval: 5s
      timeout: 3s
      retries: 10

  database-init:
    image: ${POSTGRES_IMAGE:-postgres:18}
    container_name: realdb_init
    restart: on-failure
    logging: *default-logging
    entrypoint: ["/bin/sh", "/opt/init-realdb.sh"]
    environment:
      PGPASSWORD: ${DB_PASSWORD:?請在 .env 設定 DB_PASSWORD}
    volumes:
      - ./REALDB_backup.dump:/backup/REALDB_backup.dump:ro
      - ./init-realdb.sh:/opt/init-realdb.sh:ro
      - ./dashboard/db/migrations:/opt/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - project_network

  openwebui:
    image: ${OPENWEBUI_IMAGE:-ghcr.io/open-webui/open-webui:main}
    container_name: open-webui
    restart: always
    logging: *default-logging
    ports:
      - "3000:8080"
    volumes:
      - openwebui_data:/app/backend/data
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      ENABLE_PLUGINS: "true"
      DEFAULT_MODELS: aniki
      ANIKI_API_URL: http://pipelines:8000
      ANIKI_API_KEY: ${ANIKI_API_KEY:?請在 .env 設定 ANIKI_API_KEY}
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
      pipelines:
        condition: service_healthy
    networks:
      - project_network

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: ollama
    restart: always
    logging: *default-logging
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - project_network
    # NVIDIA GPU 加速（選用）：見 docker-compose.yml 內的同段註解。
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-model-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: ollama_model_init
    restart: on-failure
    logging: *default-logging
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama pull "${VLM_MODEL:-qwen2.5vl:7b}" &&
        ollama pull "${SPC_OLLAMA_MODEL:-qwen2.5:7b}"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - project_network

  spc-api:
    image: ghcr.io/${GHCR_OWNER:?請在 .env 設定 GHCR_OWNER}/spc-model:${IMAGE_TAG:-latest}
    container_name: spc_api
    restart: always
    logging: *default-logging
    expose:
      - "8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${SPC_OLLAMA_MODEL:-qwen2.5:7b}
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - project_network

  dashboard:
    image: ghcr.io/${GHCR_OWNER:?請在 .env 設定 GHCR_OWNER}/spc-dashboard:${IMAGE_TAG:-latest}
    container_name: spc_dashboard
    restart: always
    logging: *default-logging
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/REALDB
      SPC_API_BASE: http://spc-api:8000
      SETTINGS_PASSWORD: ${SETTINGS_PASSWORD:-}
      PGPOOL_MAX: ${PGPOOL_MAX:-10}
    depends_on:
      database-init:
        condition: service_completed_successfully
      spc-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - project_network

  pipelines:
    image: ghcr.io/${GHCR_OWNER:?請在 .env 設定 GHCR_OWNER}/aniki-pipelines:${IMAGE_TAG:-latest}
    container_name: aniki_pipelines
    restart: always
    logging: *default-logging
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/REALDB
      ANIKI_API_KEY: ${ANIKI_API_KEY:?請在 .env 設定 ANIKI_API_KEY}
      OLLAMA_URL: http://ollama:11434/api/chat
      VLM_MODEL: ${VLM_MODEL:-qwen2.5vl:7b}
      VLM_RECHECK_MODEL: ${VLM_MODEL:-qwen2.5vl:7b}
      OLLAMA_KEEP_ALIVE: 10m
      REVIEW_DB_PATH: /app/data/review_tasks.db
      ANIKI_INPUT_DIR: /app/ipqc
    volumes:
      - pipelines_data:/app/data
      - ./ipqc:/app/ipqc
    depends_on:
      database-init:
        condition: service_completed_successfully
      ollama-model-init:
        condition: service_completed_successfully
    networks:
      - project_network

  aniki-openwebui-init:
    image: ${PYTHON_INIT_IMAGE:-python:3.12-slim}
    container_name: aniki_openwebui_init
    restart: on-failure
    logging: *default-logging
    command: ["python", "/opt/aniki/openwebui_bootstrap.py"]
    environment:
      OPENWEBUI_DB_PATH: /app/backend/data/webui.db
      ANIKI_PIPE_SOURCE: /opt/aniki/openwebui_aniki_pipe.py
    volumes:
      - openwebui_data:/app/backend/data
      - ./pipelines/openwebui_bootstrap.py:/opt/aniki/openwebui_bootstrap.py:ro
      - ./pipelines/openwebui_aniki_pipe.py:/opt/aniki/openwebui_aniki_pipe.py:ro
    depends_on:
      openwebui:
        condition: service_healthy
    networks:
      - project_network

volumes:
  pgdata:
  openwebui_data:
  ollama_data:
  pipelines_data:

networks:
  project_network:
    driver: bridge
